name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows running the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npm run typecheck

  tests:
    name: ${{ matrix.name }} Tests
    needs: typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    # Each test file runs in its own job, in parallel
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: login
            name: Login
          - suite: inventory
            name: Inventory
          - suite: cart
            name: Cart
          - suite: checkout
            name: Checkout

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }} tests
        run: npx playwright test tests/${{ matrix.suite }}.spec.ts
        env:
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.suite }}.zip

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.suite }}
          path: blob-report/
          retention-days: 1

  report:
    name: Test Report
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      # The final report can be downloaded from the run page
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
